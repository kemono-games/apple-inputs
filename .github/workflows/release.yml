name: Release Apple iOS inputs
run-name: Apple inputs / Xcode ${{ inputs.xcode_version }} / r${{ inputs.revision }}
on:
  workflow_dispatch:
    inputs:
      xcode_version:
        description: Exact Xcode minor or patch version from xcode-runners.json
        type: string
        required: true
        default: '26.6'
      revision:
        description: Release revision; existing tags are never overwritten
        type: string
        required: true
        default: '1'
permissions:
  contents: write
concurrency:
  group: apple-inputs-release
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve reviewed Xcode runner mapping
        id: select
        env:
          XCODE_VERSION: ${{ inputs.xcode_version }}
        run: python3 scripts/runner.py --xcode-version "$XCODE_VERSION"
  release:
    needs: select
    runs-on: ${{ needs.select.outputs.runner }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      XCODE_VERSION: ${{ inputs.xcode_version }}
      REVISION: ${{ inputs.revision }}
      SELECTED_RUNNER: ${{ needs.select.outputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test exporter
        run: python3 -m unittest discover -s tests
      - name: Export and checksum both SDKs and runtimes
        id: export
        run: |
          umask 022
          python3 -u scripts/export.py --xcode-version "$XCODE_VERSION" --revision "$REVISION"
      - name: Publish complete release (no Actions artifacts)
        env:
          TAG: ${{ steps.export.outputs.tag }}
        run: |
          set -euo pipefail
          # A draft is created first. Existing release/tag conflicts fail closed;
          # assets are never replaced with --clobber, even on a rerun.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Tag already exists: $TAG; use a new revision" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2 || exit "$status"
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "$TAG" --notes-file dist/release-notes.md
          gh release upload "$TAG" dist/apple-inputs.tar.gz dist/apple-inputs.sha256 dist/apple-inputs.json dist/provenance.json
          gh release edit "$TAG" --draft=false --latest=false
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
